<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Histórico com Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    .principal { display: flex; height: 100%; }
    .painel { width: 40%; overflow-y: auto; padding: 10px; }
    .mapa { width: 60%; height: 100%; }
    #mapa { width: 100%; height: 100%; }

    .filtros { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
    .filtros label { display: flex; align-items: center; gap: 4px; font-size: 14px; }

    .accordion-button { font-weight: bold; color: #5a2d82; }
    .accordion-body { background: #f8f9fa; }
    .btn-excluir {
      position: absolute;
      top: 8px;
      right: 8px;
      background: white;
      border: 1px solid #ccc;
      color: red;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="principal">
    <div class="painel">
      <h4>Filtros</h4>
      <div class="filtros">
        <label><input type="checkbox" class="filtro" data-filtro="categoria" value="Carro" /> Carro</label>
        <label><input type="checkbox" class="filtro" data-filtro="categoria" value="Moto" /> Moto</label>
        <label><input type="checkbox" class="filtro" data-filtro="tipo" value="Privado" /> Privado</label>
        <label><input type="checkbox" class="filtro" data-filtro="tipo" value="Público" /> Público</label>
        <label><input type="checkbox" class="filtro" data-filtro="cobranca" value="Horária" /> Horária</label>
        <label><input type="checkbox" class="filtro" data-filtro="cobranca" value="Mensal" /> Mensal</label>
        <label><input type="checkbox" class="filtro" data-filtro="horario" value="24h" /> 24h</label>
        <label><input type="checkbox" class="filtro" data-filtro="dias" value="Seg-Sex" /> Seg-Sex</label>
        <label><input type="checkbox" class="filtro" data-filtro="dias" value="Sáb-Dom" /> Sáb-Dom</label>
      </div>

      <div id="mensagem-vazia" class="alert alert-info text-center d-none">
        Nenhum histórico encontrado.
      </div>

      <div class="accordion" id="lista-vagas"></div>
    </div>

    <div class="mapa">
      <div id="mapa"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const mapa = L.map('mapa').setView([-23.55, -46.63], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

    const API_URL = "/historico/";
    let todosItens = [];
    let marcador = null;

    function aplicarFiltros() {
      const filtros = {};
      document.querySelectorAll(".filtro:checked").forEach(cb => {
        const tipo = cb.dataset.filtro;
        filtros[tipo] = filtros[tipo] || [];
        filtros[tipo].push(cb.value);
      });

      const filtrados = todosItens.filter(item => {
        for (let tipo in filtros) {
          const valores = filtros[tipo];
          const valItem = item[tipo];
          if (!valores.includes(valItem)) return false;
        }
        return true;
      });

      renderizarLista(filtrados);
    }

    function renderizarLista(lista) {
      const container = document.getElementById("lista-vagas");
      const mensagemVazia = document.getElementById("mensagem-vazia");
      container.innerHTML = "";

      if (lista.length === 0) {
        mensagemVazia.classList.remove("d-none");
        return;
      }
      mensagemVazia.classList.add("d-none");

      lista.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "accordion-item";
        const id = `item-${idx}`;

        div.innerHTML = `
          <h2 class="accordion-header" id="heading${id}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${id}">
              ${item.nome} - ${new Date(item.data).toLocaleDateString('pt-BR')}
            </button>
            <button class="btn-excluir" onclick="deletar(${item.id})">×</button>
          </h2>
          <div id="collapse${id}" class="accordion-collapse collapse" data-bs-parent="#lista-vagas">
            <div class="accordion-body">
              <div><b>Endereço:</b> ${item.endereco}</div>
              <div><b>Preço:</b> R$ ${parseFloat(item.preco).toFixed(2)}</div>
              <div><b>Categoria:</b> ${item.categoria}</div>
              <div><b>Tipo:</b> ${item.tipo}</div>
              <div><b>Cobrança:</b> ${item.cobranca}</div>
              <div><b>Funcionamento:</b> ${item.dias}</div>
              <div><b>Horário:</b> ${item.horario}</div>
              <div><b>Paradas:</b> ${item.paradas}</div>
            </div>
          </div>
        `;

        const collapse = div.querySelector(`#collapse${id}`);
        collapse.addEventListener("show.bs.collapse", () => {
          if (item.coords) {
            if (marcador) mapa.removeLayer(marcador);
            marcador = L.marker(item.coords).addTo(mapa);
            mapa.setView(item.coords, 15);
          }
        });

        container.appendChild(div);
      });
    }

    async function buscarDados() {
      try {
        const resp = await fetch(API_URL, { credentials: "include" });
        if (!resp.ok) throw new Error("Erro na API");
        const data = await resp.json();

        todosItens = data.map(item => {
          const est = item.estacionamento;
          return {
            id: item.id,
            nome: est.nome,
            endereco: est.endereco || "",
            preco: est.preco || 0,
            categoria: est.tipo || "Outro",
            tipo: est.publico_privado || "Desconhecido",
            cobranca: est.modo_cobranca || "N/D",
            dias: est.dias_funcionamento || "N/D",
            horario: est.horario_atendimento || "N/D",
            paradas: item.num_paradas || 0,
            data: item.data_visita || Date.now(),
            coords: (est.latitude && est.longitude) ? [est.latitude, est.longitude] : null
          };
        });

        renderizarLista(todosItens);
      } catch (e) {
        document.getElementById("lista-vagas").innerHTML = `<div class="alert alert-danger">Erro ao buscar dados.</div>`;
      }
    }

    async function deletar(id) {
      if (!confirm("Deseja realmente excluir este item?")) return;
      try {
        const resp = await fetch(`/historico/${id}/`, {
          method: "DELETE",
          credentials: "include"
        });
        if (!resp.ok) throw new Error("Erro ao deletar");

        todosItens = todosItens.filter(item => item.id !== id);
        aplicarFiltros();
      } catch (e) {
        alert("Erro ao excluir item.");
      }
    }

    document.querySelectorAll(".filtro").forEach(cb =>
      cb.addEventListener("change", aplicarFiltros)
    );

    buscarDados();
  </script>
</body>
</html>
